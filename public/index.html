<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSICVID • 1080p</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center p-4">
<div class="max-w-2xl w-full">
  <h1 class="text-4xl font-black text-center mb-2 bg-gradient-to-r from-purple-400 to-pink-600 bg-clip-text text-transparent">MUSICVID • 1080p</h1>
  <p class="text-center text-zinc-400 mb-2">Paste YouTube link - get true 1080p MP4</p>
  <p class="text-center text-[11px] text-zinc-600 mb-6">Auto-fallback: If Render is blocked, switches to Cobalt API</p>
  
  <div class="bg-zinc-900 rounded-2xl p-6 border border-zinc-800">
    <div class="flex gap-2 mb-4">
      <input id="url" placeholder="https://youtube.com/watch?v=..." class="flex-1 bg-black border border-zinc-700 rounded-xl px-4 py-3 outline-none focus:border-purple-500">
      <button onclick="getInfo()" class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-xl font-bold">GET</button>
    </div>
    
    <div class="flex gap-2 mb-6">
      <button onclick="setQ('1080')" id="q1080" class="q-btn bg-purple-600 px-4 py-2 rounded-full text-sm font-bold">1080p</button>
      <button onclick="setQ('720')" id="q720" class="q-btn bg-zinc-800 px-4 py-2 rounded-full text-sm">720p</button>
      <button onclick="setQ('480')" id="q480" class="q-btn bg-zinc-800 px-4 py-2 rounded-full text-sm">480p</button>
    </div>
    
    <div id="preview" class="hidden">
      <img id="thumb" class="w-full rounded-xl mb-3 aspect-video object-cover bg-zinc-800">
      <h3 id="title" class="font-bold"></h3>
      <p id="uploader" class="text-sm text-zinc-400 mb-2"></p>
      <div id="modeBadge" class="text-[11px] mb-4"></div>
      <button id="dlBtn" onclick="download()" class="w-full bg-white text-black py-4 rounded-xl font-black text-lg hover:bg-zinc-200">⬇ DOWNLOAD 1080p MP4</button>
      <button id="dlBtnCobalt" onclick="downloadCobalt()" class="hidden w-full bg-zinc-800 text-white py-4 rounded-xl font-bold text-sm mt-2 border border-zinc-700">Try Cobalt Fallback (if main fails)</button>
      <p id="status" class="text-center text-sm text-zinc-500 mt-3"></p>
    </div>
    
    <div id="errorBox" class="hidden mt-4 bg-red-950/50 border border-red-900 rounded-xl p-3 text-sm"></div>
  </div>
  
  <p class="text-center text-xs text-zinc-600 mt-6">Powered by yt-dlp + ffmpeg • Cobalt fallback • Hosted on Render Free</p>
</div>

<script>
let currentQuality = '1080';
let currentUrl = '';
let useCobalt = false;
let cobaltData = null;

function setQ(q){
  currentQuality = q;
  document.querySelectorAll('.q-btn').forEach(b=>b.className='q-btn bg-zinc-800 px-4 py-2 rounded-full text-sm');
  document.getElementById('q'+q).className='q-btn bg-purple-600 px-4 py-2 rounded-full text-sm font-bold';
  const btn = document.getElementById('dlBtn');
  if(btn) btn.textContent = `⬇ DOWNLOAD ${q}p MP4`;
}

async function getInfo(){
  const url = document.getElementById('url').value.trim();
  if(!url) return alert('Paste YouTube link');
  currentUrl = url;
  useCobalt = false;
  cobaltData = null;
  document.getElementById('preview').classList.remove('hidden');
  document.getElementById('errorBox').classList.add('hidden');
  document.getElementById('status').textContent = 'Fetching info (android client)...';
  document.getElementById('modeBadge').innerHTML = '<span class="bg-zinc-800 px-2 py-1 rounded">Mode: Direct (yt-dlp)</span>';
  
  try{
    const r = await fetch(`/api/info?url=${encodeURIComponent(url)}`);
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    document.getElementById('thumb').src = data.thumbnail;
    document.getElementById('title').textContent = data.title;
    document.getElementById('uploader').textContent = data.uploader || '';
    document.getElementById('status').textContent = 'Ready - Direct download available';
    document.getElementById('dlBtn').classList.remove('hidden');
  }catch(e){
    console.log('Direct failed, trying cobalt info...', e.message);
    document.getElementById('status').textContent = 'Direct blocked by YouTube (429/bot), switching to Cobalt fallback...';
    document.getElementById('modeBadge').innerHTML = '<span class="bg-yellow-900/50 border border-yellow-800 px-2 py-1 rounded text-yellow-200">Mode: Cobalt Fallback (still 1080p)</span>';
    // Try cobalt
    try{
      const r = await fetch(`/api/download-cobalt?url=${encodeURIComponent(url)}`);
      const data = await r.json();
      if(data.url){
        cobaltData = data;
        useCobalt = true;
        document.getElementById('title').textContent = 'Video ready via Cobalt (1080p)';
        document.getElementById('thumb').src = `https://img.youtube.com/vi/${extractId(url)}/maxresdefault.jpg`;
        document.getElementById('status').textContent = 'Ready via Cobalt fallback - still 1080p';
        document.getElementById('dlBtn').textContent = '⬇ DOWNLOAD via Cobalt';
      } else {
        throw new Error(data.error || 'Cobalt failed');
      }
    }catch(e2){
      document.getElementById('errorBox').classList.remove('hidden');
      document.getElementById('errorBox').innerHTML = `Both methods blocked.<br><br><b>Fix:</b> Add cookies.txt to your repo (see guide).<br>Error: ${e.message.slice(0,200)}`;
      document.getElementById('status').textContent = 'Both failed - add cookies.txt';
      document.getElementById('dlBtnCobalt').classList.remove('hidden');
    }
  }
}

function extractId(url){
  try{
    const u = new URL(url);
    return u.searchParams.get('v') || url.split('/').pop();
  }catch{ return ''; }
}

function download(){
  if(useCobalt && cobaltData){
    downloadCobalt();
    return;
  }
  const btn = document.getElementById('dlBtn');
  btn.textContent = 'Downloading & Merging... (30-60s)';
  btn.disabled = true;
  document.getElementById('status').textContent = 'Merging 1080p video + audio... please wait';
  window.location.href = `/api/download?url=${encodeURIComponent(currentUrl)}&quality=${currentQuality}`;
  setTimeout(()=>{
    btn.textContent = `⬇ DOWNLOAD ${currentQuality}p MP4`;
    btn.disabled = false;
    if(!useCobalt){
      document.getElementById('dlBtnCobalt').classList.remove('hidden');
      document.getElementById('status').textContent = 'If it failed (bot error), click Cobalt Fallback below';
    }
  }, 6000);
}

async function downloadCobalt(){
  document.getElementById('status').textContent = 'Getting Cobalt link...';
  try{
    let data = cobaltData;
    if(!data){
      const r = await fetch(`/api/download-cobalt?url=${encodeURIComponent(currentUrl)}`);
      data = await r.json();
    }
    if(data.url){
      document.getElementById('status').textContent = 'Starting download via Cobalt...';
      window.location.href = data.url;
    } else {
      document.getElementById('status').textContent = 'Cobalt error: ' + (data.error || JSON.stringify(data).slice(0,200));
    }
  }catch(e){
    document.getElementById('status').textContent = 'Cobalt failed: ' + e.message;
  }
}
</script>
</body>
</html>
